services:
  mediamtx-dashboard:
    build: .
    container_name: mediamtx_dashboard_wiko
    network_mode: host
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - mediamtx_logs:/var/log/mediamtx
    environment:
      - MEDIAMTX_API_URL=http://127.0.0.1:9997
      - LOG_FILE_PATH=/var/log/mediamtx/mediamtx.log
      - NODE_EXPORTER_URL=http://127.0.0.1:9100
    depends_on:
      - mediamtx
      - node-exporter
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC / WHEP
      - "9997:9997"   # API
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
      - mediamtx_logs:/var/log/mediamtx
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)'
    pid: host
    network_mode: host
    volumes:
      - '/:/host:ro,rslave'
    restart: unless-stopped

volumes:
  mediamtx_logs:
