<div id="page-streams" class="page">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Streams</h2>
        <p class="text-gray-600 mt-1">
            Monitor active stream paths and their runtime status
        </p>
    </div>

    <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
        <div
            class="px-6 py-4 border-b border-gray-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"
        >
            <div class="flex items-center gap-4">
                <h3 class="text-lg font-medium text-gray-900">
                    Path Configuration
                </h3>
                <div class="relative">
                    <input
                        type="checkbox"
                        id="active-paths"
                        class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 cursor-pointer"
                    />
                <label class="text-sm font-medium text-gray-700 cursor-pointer select-none" for="active-paths">Filter status aktif</label>
                </div>
            </div>
        </div>
        <div
            class="bg-white rounded-lg border border-gray-200 overflow-hidden mb-8"
        >
            <div
                class="px-6 py-4 border-b border-gray-200 flex items-center justify-between"
            >
                <h3 class="text-lg font-medium text-gray-900">
                    Active Streams
                </h3>
                <span id="streams-count" class="text-sm text-gray-500"
                    >0 streams</span
                >
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            >
                                Name
                            </th>
                            <th
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            >
                                Status
                            </th>
                            <th
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            >
                                Tracks
                            </th>
                            <th
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            >
                                Readers
                            </th>
                            <th
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            >
                                Traffic In
                            </th>
                            <th
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            >
                                Traffic Out
                            </th>
                            <th
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                            >
                                Actions
                            </th>
                        </tr>
                    </thead>
                    <tbody
                        id="streams-table-body"
                        class="divide-y divide-gray-200"
                    >
                        <tr>
                            <td
                                colspan="7"
                                class="px-6 py-12 text-center text-gray-500"
                            >
                                Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Configuration Global Page -->
