<div id="page-config-global" class="page">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Configuration - Global</h2>
        <p class="text-gray-600 mt-1">Global MediaMTX server configuration</p>
    </div>

    <div class="bg-white rounded-lg border border-gray-200 p-6 max-w-3xl">
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2"
                >Configuration (JSON)</label
            >
            <textarea
                id="config-global-editor"
                class="w-full font-mono text-sm bg-gray-50 border border-gray-300 rounded-lg p-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
                rows="20"
                spellcheck="false"
            ></textarea>
        </div>
        <div class="flex justify-end space-x-3">
            <button
                id="config-global-reset"
                class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
            >
                Reset
            </button>
            <button
                id="config-global-save"
                class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
            >
                Save Changes
            </button>
        </div>
        <div id="config-global-status" class="mt-4 text-sm hidden"></div>
    </div>
</div>
