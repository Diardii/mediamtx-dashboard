<div id="page-config-defaults" class="page">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-900">
            Configuration - Path Defaults
        </h2>
        <p class="text-gray-600 mt-1">Default settings applied to new paths</p>
    </div>

    <div class="mb-6 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
        Changes are applied to the MediaMTX runtime through the Control API. They
        are not written to <code class="font-mono">mediamtx.yml</code> and will
        be lost when MediaMTX restarts.
    </div>

    <form id="config-defaults-form" class="space-y-6">
        <div id="config-defaults-fields" class="space-y-6">
            <div class="rounded-lg border border-gray-200 bg-white p-6 text-sm text-gray-500">
                Loading Path Defaults...
            </div>
        </div>

        <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div id="config-defaults-status" class="text-sm hidden" role="status" aria-live="polite"></div>
            <div class="flex justify-end space-x-3 sm:ml-auto">
                <button
                    id="config-defaults-reset"
                    type="button"
                    class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
                >
                    Reset
                </button>
                <button
                    id="config-defaults-save"
                    type="submit"
                    class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                >
                    Save Changes
                </button>
            </div>
        </div>
    </form>
</div>
